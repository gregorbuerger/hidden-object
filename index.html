<!doctype html><html lang='de'><head><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta charset='utf-8'><title>Patch Test</title><style>*{box-sizing:border-box}body{margin:0;background:#24265c;color:white;font-family:system-ui}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}.game{position:relative;width:min(100vw,765px);margin:auto;overflow:hidden;background:#111}.scene{display:block;width:100%;height:auto}.patch{position:absolute;left:3.27%;top:21.48%;width:20.26%;height:20.51%;object-fit:cover;opacity:0;transition:opacity .12s}.hit{position:absolute;left:4%;top:23%;width:17%;height:18%;z-index:4}.fly{position:fixed;display:none;z-index:20;pointer-events:none;object-fit:cover;border-radius:8px}.bar{position:sticky;bottom:0;background:#343579;padding:12px 16px 18px}.row{display:flex;justify-content:space-between;font-size:20px;font-weight:800}.tile{margin-top:10px;width:86px;height:86px;background:white;border-radius:16px;display:grid;place-items:center;overflow:hidden}.tile img{max-width:80%;max-height:80%;object-fit:contain}.done{opacity:.25}.note{text-align:center;font-size:13px;opacity:.8;margin-top:8px}.reset{border:0;border-radius:16px;padding:10px 18px;background:#716be0;color:#fff;font-size:16px;margin-top:10px}</style></head><body><div class='top'><span>Find Hidden Objects</span><span>Patch-Test v0.10</span></div><div class='game' id='game'><img class='scene' src='vorher.jpg'><img class='patch' id='patch' src='patch_after.jpg'><div class='hit' id='hit'></div></div><div class='bar'><div class='row'><span>Finde die Laterne</span><span id='count'>0/1</span></div><div class='tile' id='tile'><img src='lantern_crop.jpg'></div><button class='reset' onclick='location.reload()'>Neu</button><div class='note'>Nur der kleine Bereich hinter der Laterne wird ersetzt. Der Rest des Bildes bleibt unverändert.</div></div><img id='fly' class='fly' src='lantern_crop.jpg'><script>const hit=document.getElementById('hit'),patch=document.getElementById('patch'),fly=document.getElementById('fly'),tile=document.getElementById('tile');let done=false;hit.onclick=()=>{if(done)return;done=true;const a=hit.getBoundingClientRect(),b=tile.getBoundingClientRect();fly.style.display='block';fly.style.left=a.left+'px';fly.style.top=a.top+'px';fly.style.width=a.width+'px';fly.style.height=a.height+'px';fly.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.45)`,opacity:.15}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{fly.style.display='none'};setTimeout(()=>patch.style.opacity='1',180);setTimeout(()=>{tile.classList.add('done');document.getElementById('count').textContent='1/1'},520)};</script></body></html>
