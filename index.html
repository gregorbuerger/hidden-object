<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Hidden Objects v0.12</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#171831;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:64px;background:#3d3c7e;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:20px}.game{position:relative;flex:1;min-height:0;background:#090a12;overflow:hidden;touch-action:none}.world{position:absolute;transform-origin:0 0}.world img.scene{display:block;width:765px;height:1024px;user-select:none;-webkit-user-drag:none}.hit{position:absolute;border:0;background:transparent;padding:0}.hit:active{background:rgba(255,255,255,.08)}.bar{background:#3d3c7e;padding:12px 14px max(14px,env(safe-area-inset-bottom));flex:0 0 auto}.barhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:800;margin-bottom:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{height:92px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card img{max-width:82%;max-height:82%;object-fit:contain}.card.done{background:#d9f2df;opacity:.7}.check{display:none;position:absolute;right:6px;top:6px;background:#35bd67;border-radius:50%;width:28px;height:28px;place-items:center;font-weight:900}.done .check{display:grid}.msg{text-align:center;font-size:13px;opacity:.8;margin-top:8px}.fly{position:fixed;z-index:20;pointer-events:none;border-radius:12px;box-shadow:0 0 20px #ffd56a;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s}.win{position:absolute;inset:0;display:none;place-items:center;background:#0008;z-index:10}.win>div{background:#3d3c7e;padding:24px;border-radius:22px;font-size:24px;font-weight:900}
</style></head><body><div class="app"><div class="top"><span>Find Hidden Objects</span><span>Patch-Test v0.12</span></div><div class="game" id="game"><div class="world" id="world"><img class="scene" src="scene.jpg" alt="Wimmelbild"><button class="hit" data-id="laterne" style="left:4%;top:24%;width:18%;height:25%" aria-label="Laterne"></button><button class="hit" data-id="fernglas" style="left:23%;top:38%;width:22%;height:14%" aria-label="Fernglas"></button><button class="hit" data-id="stiefel" style="left:69%;top:62%;width:16%;height:17%" aria-label="Stiefel"></button></div><div class="win" id="win"><div>3/3 gefunden ✓</div></div></div><div class="bar"><div class="barhead"><span>Finde diese Gegenstände</span><span id="count">0/3</span></div><div class="cards"><div class="card" data-card="laterne"><img src="laterne.jpg"><span class="check">✓</span></div><div class="card" data-card="fernglas"><img src="fernglas.jpg"><span class="check">✓</span></div><div class="card" data-card="stiefel"><img src="stiefel.jpg"><span class="check">✓</span></div></div><div class="msg">Nur lokale Bildbereiche werden ersetzt; die übrige Szene bleibt unverändert.</div></div></div><script>
const game=document.getElementById('game'),world=document.getElementById('world');let base=1,scale=1,tx=0,ty=0,found=new Set(),pointers=new Map(),pinch=null;
function fit(){const r=game.getBoundingClientRect();base=Math.min(r.width/765,r.height/1024);scale=base;tx=(r.width-765*scale)/2;ty=(r.height-1024*scale)/2;apply()}function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}addEventListener('resize',fit);fit();
const regions={laterne:{x:20,y:250,w:175,h:260,patch:'patch_laterne.jpg'},fernglas:{x:165,y:365,w:220,h:165,patch:'patch_fernglas.jpg'},stiefel:{x:505,y:600,w:165,h:210,patch:'patch_stiefel.jpg'}};
function addPatch(id){const o=regions[id],im=document.createElement('img');im.src=o.patch;Object.assign(im.style,{position:'absolute',left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px',pointerEvents:'none'});world.appendChild(im)}
function collect(id,btn){if(found.has(id))return;found.add(id);const card=document.querySelector(`[data-card=${id}]`);const br=btn.getBoundingClientRect(),cr=card.getBoundingClientRect();const clone=card.querySelector('img').cloneNode();clone.className='fly';Object.assign(clone.style,{left:br.left+'px',top:br.top+'px',width:Math.min(br.width,120)+'px',height:Math.min(br.height,120)+'px',objectFit:'contain'});document.body.appendChild(clone);requestAnimationFrame(()=>{clone.style.transform=`translate(${cr.left-br.left+(cr.width-br.width)/2}px,${cr.top-br.top+(cr.height-br.height)/2}px) scale(.55)`;clone.style.opacity='.15'});setTimeout(()=>{addPatch(id);btn.remove();card.classList.add('done');clone.remove();document.getElementById('count').textContent=found.size+'/3';if(found.size===3)document.getElementById('win').style.display='grid'},520)}
world.addEventListener('click',e=>{const b=e.target.closest('.hit');if(b)collect(b.dataset.id,b)});
game.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});game.setPointerCapture(e.pointerId);if(pointers.size===2){let a=[...pointers.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:scale}}});game.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&scale>base){tx+=e.clientX-old.x;ty+=e.clientY-old.y;apply()}else if(pointers.size===2&&pinch){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=Math.max(base,Math.min(base*3,pinch.s*d/pinch.d));apply()}});game.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null});game.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
</script></body></html>
