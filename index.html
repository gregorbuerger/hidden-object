<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta charset="utf-8"><title>3-Objekt Patch Test</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#171a36;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;flex:none;background:#3b3b7c;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}.stage{position:relative;flex:1;min-height:0;background:#111;overflow:hidden;touch-action:none}.world{position:absolute;transform-origin:0 0}.scene{display:block;width:765px;height:715px}.patch,.hit{position:absolute}.patch{display:none;z-index:2}.hit{z-index:4;background:transparent;border:0}.bar{flex:none;background:#3b3b7c;padding:10px 12px calc(12px + env(safe-area-inset-bottom));}.row{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:8px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{height:88px;background:white;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.card img{width:78%;height:78%;object-fit:contain}.card.done{background:#dff7df;opacity:.72}.card.done:after{content:'✓';position:absolute;right:7px;top:6px;background:#27b95f;border-radius:50%;width:27px;height:27px;display:grid;place-items:center;font-weight:900}.fly{position:fixed;z-index:99;pointer-events:none;object-fit:contain;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s}.note{text-align:center;font-size:12px;opacity:.75;margin-top:7px}</style></head><body><div class="app"><div class="top"><span>Find Hidden Objects</span><span>Patch-Test v0.11</span></div><div class="stage" id="stage"><div class="world" id="world"><img class="scene" src="scene.jpg"><img id="p0" class="patch" src="laterne_patch.jpg" style="left:35px;top:245px;width:130px;height:180px"><img id="p1" class="patch" src="fernglas_patch.jpg" style="left:150px;top:350px;width:175px;height:110px"><img id="p2" class="patch" src="stiefel_patch.jpg" style="left:565px;top:440px;width:115px;height:140px"><button class="hit" data-i="0" style="left:45px;top:255px;width:110px;height:160px"></button><button class="hit" data-i="1" style="left:165px;top:365px;width:145px;height:80px"></button><button class="hit" data-i="2" style="left:580px;top:455px;width:85px;height:110px"></button></div></div><div class="bar"><div class="row"><span>Finde diese Gegenstände</span><span id="count">0/3</span></div><div class="items"><div class="card" id="c0"><img src="laterne_object.png"></div><div class="card" id="c1"><img src="fernglas_object.png"></div><div class="card" id="c2"><img src="stiefel_object.png"></div></div><div class="note">Die Szene bleibt identisch; nur der lokale Bereich des gefundenen Objekts wird ersetzt.</div></div></div><script>
const stage=document.getElementById('stage'),world=document.getElementById('world');let scale=1,ox=0,oy=0,found=[0,0,0];function fit(){let r=stage.getBoundingClientRect();scale=Math.min(r.width/765,r.height/715);ox=(r.width-765*scale)/2;oy=(r.height-715*scale)/2;world.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`}addEventListener('resize',fit);fit();
const names=['laterne','fernglas','stiefel'];document.querySelectorAll('.hit').forEach(b=>b.onclick=()=>collect(+b.dataset.i,b));function collect(i,b){if(found[i])return;found[i]=1;let r=b.getBoundingClientRect(),card=document.getElementById('c'+i).getBoundingClientRect(),f=document.createElement('img');f.src=names[i]+'_object.png';f.className='fly';f.style.left=r.left+'px';f.style.top=r.top+'px';f.style.width=r.width+'px';f.style.height=r.height+'px';document.body.appendChild(f);requestAnimationFrame(()=>{let tx=card.left+card.width/2-(r.left+r.width/2),ty=card.top+card.height/2-(r.top+r.height/2);f.style.transform=`translate(${tx}px,${ty}px) scale(.45)`;f.style.opacity='.15'});setTimeout(()=>{document.getElementById('p'+i).style.display='block';b.style.display='none';document.getElementById('c'+i).classList.add('done');f.remove();document.getElementById('count').textContent=found.reduce((a,b)=>a+b,0)+'/3'},430)}
</script></body></html>
