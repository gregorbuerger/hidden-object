<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Hidden Object Zustands-Test</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#18224d;font-family:system-ui,-apple-system,sans-serif;color:white;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#373875;font-weight:800}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#11172e;touch-action:none}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.after{opacity:0}.hit{position:absolute;left:3%;top:22%;width:18%;height:25%;border:0;background:transparent;z-index:5}.fly{position:fixed;display:none;z-index:30;width:90px;height:110px;object-fit:cover;object-position:3% 28%;border-radius:12px;box-shadow:0 0 25px #ffd85c}.bar{background:#343574;padding:10px 12px max(12px,env(safe-area-inset-bottom));}.barhead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.items{display:flex;gap:8px}.tile{height:74px;flex:1;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.tile img{width:100%;height:100%;object-fit:cover}.tile.done{background:#dff5df}.check{display:none;position:absolute;right:5px;top:5px;background:#22b95d;border-radius:50%;width:25px;height:25px;align-items:center;justify-content:center;font-weight:900}.done .check{display:flex}.note{font-size:12px;opacity:.8;text-align:center;margin-top:7px}
</style></head><body><div class="app"><div class="top"><span>Find Hidden Objects</span><span>Test v0.9</span></div><div class="stage" id="stage"><img class="scene before" src="vorher.jpg"><img class="scene after" id="after" src="nachher.jpg"><button class="hit" id="hit" aria-label="Laterne finden"></button></div><div class="bar"><div class="barhead"><span>Finde die Laterne</span><span id="count">0/1</span></div><div class="items"><div class="tile" id="tile"><img src="vorher.jpg" style="object-position:3% 28%"><span class="check">✓</span></div></div><div class="note">Tippe auf die rote Laterne im Bild.</div></div></div><img class="fly" id="fly" src="vorher.jpg"><script>
const hit=document.getElementById('hit'),after=document.getElementById('after'),fly=document.getElementById('fly'),tile=document.getElementById('tile'),count=document.getElementById('count');let done=false;
hit.addEventListener('click',()=>{if(done)return;done=true;const a=hit.getBoundingClientRect(),b=tile.getBoundingClientRect();fly.style.display='block';fly.style.left=a.left+'px';fly.style.top=a.top+'px';fly.style.width=Math.max(70,a.width*.75)+'px';fly.style.height=Math.max(90,a.height*.75)+'px';fly.animate([{transform:'scale(1)',opacity:1},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(.55)`,opacity:.95}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});setTimeout(()=>{after.style.opacity='1';},300);setTimeout(()=>{fly.style.display='none';tile.classList.add('done');count.textContent='1/1';hit.style.display='none'},650)});
</script></body></html>
