<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#31316f" />
<title>Find Hidden Objects</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#17182d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}button{font:inherit;color:inherit}
#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#17182d}
.top{height:64px;background:#3c397d;display:flex;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;gap:12px;z-index:20;box-shadow:0 2px 10px #0005}.title{font-weight:800;font-size:21px;flex:1;white-space:nowrap}.version{font-size:12px;opacity:.7;margin-left:4px}.hearts{font-size:20px;letter-spacing:2px}.counterTop{font-weight:800;font-size:18px;min-width:48px;text-align:right}
.viewport{position:relative;overflow:hidden;background:#0d0e17;touch-action:none;user-select:none}.scene{position:absolute;left:0;top:0;width:1536px;height:690px;transform-origin:0 0;will-change:transform}.scene>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}.obj{position:absolute;transform-origin:center;cursor:pointer;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));will-change:transform,opacity}.obj img{display:block;width:100%;height:100%;object-fit:contain}.obj.hint{animation:pulse 1s ease-in-out 3}.obj.hint:after{content:"";position:absolute;inset:-10px;border:5px solid #ffe76c;border-radius:50%;box-shadow:0 0 0 8px #ffe76c44,0 0 25px #fff;pointer-events:none}@keyframes pulse{50%{filter:drop-shadow(0 0 18px #fff) drop-shadow(0 0 18px #ffe34d);transform:scale(1.08)}}
.bottom{background:#343274;padding:8px 10px max(10px,env(safe-area-inset-bottom));z-index:30;box-shadow:0 -3px 12px #0005}.bottomHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding:0 4px;font-weight:800;font-size:17px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.slot{height:74px;border-radius:14px;background:#fff;position:relative;display:grid;place-items:center;overflow:hidden;border:0;padding:5px}.slot img{max-width:88%;max-height:88%;object-fit:contain}.slot.found{background:#dff5df}.slot.found img{opacity:.25}.check{display:none;position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:#32c36b;color:#fff;font-size:18px;place-items:center;font-weight:900;box-shadow:0 2px 5px #0004}.slot.found .check{display:grid}.controls{height:52px;display:flex;align-items:center;justify-content:center;gap:16px;margin-top:7px}.control{border:0;border-radius:16px;background:#706ce0;padding:8px 18px;display:flex;align-items:center;gap:7px;min-width:112px;justify-content:center}.control .ico{font-size:25px}.control small{font-size:13px}.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-10px);background:#153a2bde;border:1px solid #6ce29a;border-radius:20px;padding:9px 16px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fly{position:fixed;z-index:999;pointer-events:none;object-fit:contain;filter:drop-shadow(0 0 12px #ffe36d);transition:transform .62s cubic-bezier(.2,.9,.25,1),opacity .62s ease}.miss{position:absolute;width:32px;height:32px;border:3px solid #ff5d65;border-radius:50%;pointer-events:none;animation:miss .5s ease forwards;z-index:40}@keyframes miss{to{transform:scale(1.6);opacity:0}}.complete{position:fixed;inset:0;background:#14152de6;z-index:1000;display:none;place-items:center;text-align:center;padding:30px}.complete.show{display:grid}.card{background:#39377d;border-radius:26px;padding:28px;max-width:340px;box-shadow:0 20px 60px #0008}.card h2{margin:0 0 8px}.card button{border:0;background:#706ce0;border-radius:16px;padding:12px 22px;margin-top:16px;font-weight:800}
@media(max-height:720px){.top{height:54px}.slot{height:62px}.controls{height:46px}.bottom{padding-top:6px}.bottomHead{font-size:15px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="title">Find Hidden Objects <span class="version">v1.0 Testlevel</span></div><div class="hearts" id="hearts">❤️❤️❤️</div><div class="counterTop" id="counterTop">0/10</div></header>
<main class="viewport" id="viewport"><div class="toast" id="toast">Gefunden!</div><div class="scene" id="scene"><img class="bg" src="scene.png" alt="Wimmelbild"></div></main>
<section class="bottom"><div class="bottomHead"><span>Finde diese Gegenstände</span><span id="progress">0/10</span></div><div class="slots" id="slots"></div><div class="controls"><button class="control" id="hint"><span class="ico">💡</span><small>Hinweis</small></button><button class="control" id="reset"><span class="ico">↻</span><small>Neu</small></button></div></section>
</div>
<div class="complete" id="complete"><div class="card"><div style="font-size:52px">🎉</div><h2>Level geschafft!</h2><p>Du hast alle 10 Gegenstände gefunden.</p><button id="again">Nochmal spielen</button></div></div>
<script>
const ITEMS=[
{id:'laterne',src:'laterne.png',x:7.0,y:38.0,w:8.2,r:-2},
{id:'fernglas',src:'fernglas.png',x:25.0,y:51.0,w:10.8,r:3},
{id:'stiefel',src:'stiefel.png',x:59.0,y:69.0,w:8.5,r:0},
{id:'taschenuhr',src:'taschenuhr.png',x:43.0,y:47.0,w:5.4,r:-5},
{id:'schluessel',src:'schluessel.png',x:35.0,y:56.0,w:6.0,r:78},
{id:'auto',src:'auto.png',x:28.0,y:77.0,w:6.4,r:-5},
{id:'kompass',src:'kompass.png',x:46.5,y:73.5,w:5.7,r:9},
{id:'lupe',src:'lupe.png',x:18.5,y:59.0,w:6.0,r:-22},
{id:'schmetterling',src:'schmetterling.svg',x:71.0,y:48.0,w:5.4,r:7},
{id:'becher',src:'becher.svg',x:82.0,y:62.0,w:5.8,r:0}
];
const scene=document.getElementById('scene'), viewport=document.getElementById('viewport'),slots=document.getElementById('slots'),toast=document.getElementById('toast');
let found=new Set(), lives=3, queue=ITEMS.slice(), scale=1, minScale=1, tx=0,ty=0,pointers=new Map(),startDist=0,startScale=1,startMid=null,startTx=0,startTy=0,dragStart=null,moved=false;
function buildObjects(){scene.querySelectorAll('.obj').forEach(e=>e.remove()); ITEMS.forEach(it=>{let d=document.createElement('div');d.className='obj';d.dataset.id=it.id;d.style.left=it.x+'%';d.style.top=it.y+'%';d.style.width=it.w+'%';d.style.transform=`translate(-50%,-50%) rotate(${it.r||0}deg)`;let im=new Image();im.src=it.src;d.appendChild(im);d.addEventListener('pointerdown',e=>e.stopPropagation());d.addEventListener('click',e=>{e.stopPropagation();tryFind(it.id,d)});scene.appendChild(d)})}
function activeIds(){return queue.filter(i=>!found.has(i.id)).slice(0,5).map(i=>i.id)}
function renderSlots(){slots.innerHTML='';activeIds().forEach(id=>{let it=ITEMS.find(x=>x.id===id),b=document.createElement('div');b.className='slot';b.dataset.id=id;b.innerHTML=`<img src="${it.src}"><span class="check">✓</span>`;slots.appendChild(b)}); while(slots.children.length<5){let e=document.createElement('div');e.className='slot';e.style.opacity=.18;slots.appendChild(e)} document.getElementById('progress').textContent=`${found.size}/10`;document.getElementById('counterTop').textContent=`${found.size}/10`;document.getElementById('hearts').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),700)}
function tryFind(id,el){if(found.has(id))return;if(!activeIds().includes(id)){missAtElement(el);return} const slot=document.querySelector(`.slot[data-id="${id}"]`);const r=el.getBoundingClientRect(),sr=slot.getBoundingClientRect();const clone=el.querySelector('img').cloneNode();clone.className='fly';clone.style.left=r.left+'px';clone.style.top=r.top+'px';clone.style.width=r.width+'px';clone.style.height=r.height+'px';document.body.appendChild(clone);requestAnimationFrame(()=>{let dx=sr.left+sr.width/2-(r.left+r.width/2),dy=sr.top+sr.height/2-(r.top+r.height/2);clone.style.transform=`translate(${dx}px,${dy}px) scale(.55)`;clone.style.opacity='.15'});found.add(id);el.style.transition='opacity .25s,transform .25s';el.style.opacity='0';setTimeout(()=>{el.remove();clone.remove();renderSlots();showToast('Gefunden!');if(found.size===ITEMS.length)document.getElementById('complete').classList.add('show')},620)}
function missAtElement(el){let r=el.getBoundingClientRect();miss(r.left+r.width/2,r.top+r.height/2)}
function miss(x,y){lives=Math.max(0,lives-1);renderSlots();let m=document.createElement('div');m.className='miss';m.style.left=(x-16)+'px';m.style.top=(y-16)+'px';document.body.appendChild(m);setTimeout(()=>m.remove(),550);if(lives===0){showToast('Keine Leben mehr');setTimeout(resetGame,900)}}
function fit(){let rw=viewport.clientWidth/1536,rh=viewport.clientHeight/690;minScale=Math.min(rw,rh);scale=minScale;tx=(viewport.clientWidth-1536*scale)/2;ty=(viewport.clientHeight-690*scale)/2;apply()}
function clamp(){let w=1536*scale,h=690*scale,vw=viewport.clientWidth,vh=viewport.clientHeight;if(w<=vw)tx=(vw-w)/2;else tx=Math.min(0,Math.max(vw-w,tx));if(h<=vh)ty=(vh-h)/2;else ty=Math.min(0,Math.max(vh-h,ty))}
function apply(){clamp();scene.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
viewport.addEventListener('pointerdown',e=>{viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(pointers.size===1){dragStart={x:e.clientX,y:e.clientY};startTx=tx;startTy=ty}else if(pointers.size===2){let p=[...pointers.values()];startDist=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y);startScale=scale;startMid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};startTx=tx;startTy=ty}});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&dragStart){let p=[...pointers.values()][0],dx=p.x-dragStart.x,dy=p.y-dragStart.y;if(Math.hypot(dx,dy)>5)moved=true;tx=startTx+dx;ty=startTy+dy;apply()}else if(pointers.size===2){moved=true;let p=[...pointers.values()],dist=Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};let ns=Math.max(minScale,Math.min(minScale*3.2,startScale*(dist/startDist)));let sceneX=(startMid.x-startTx)/startScale,sceneY=(startMid.y-startTy)/startScale;scale=ns;tx=mid.x-sceneX*scale;ty=mid.y-sceneY*scale;apply()}});
viewport.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(pointers.size===0){if(!moved&&e.target===viewport)miss(e.clientX,e.clientY);dragStart=null}else if(pointers.size===1){let p=[...pointers.values()][0];dragStart={x:p.x,y:p.y};startTx=tx;startTy=ty}});viewport.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
document.getElementById('hint').onclick=()=>{let id=activeIds()[0],el=scene.querySelector(`.obj[data-id="${id}"]`);if(el){el.classList.remove('hint');void el.offsetWidth;el.classList.add('hint')}};
function resetGame(){found.clear();lives=3;queue=ITEMS.slice();document.getElementById('complete').classList.remove('show');buildObjects();renderSlots();fit()}
document.getElementById('reset').onclick=resetGame;document.getElementById('again').onclick=resetGame;window.addEventListener('resize',fit);buildObjects();renderSlots();requestAnimationFrame(fit);
</script>
</body></html>
