<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#302f68">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>Find Hidden Objects</title>
</head>
<body>
<main>
  <header>
    <b>Find Hidden Objects <small>v0.4</small></b>
    <span id="lives">❤️ 3</span>
  </header>

  <section id="viewport">
    <div id="world">
      <img id="scene" src="scene-game.png" alt="Wimmelbild" draggable="false">

      <img class="clean-patch" data-id="0" src="clean-auto.png" alt="">
      <img class="clean-patch" data-id="1" src="clean-hut.png" alt="">
      <img class="clean-patch" data-id="2" src="clean-lupe.png" alt="">
      <img class="clean-patch" data-id="3" src="clean-schluessel.png" alt="">
      <img class="clean-patch" data-id="4" src="clean-kompass.png" alt="">

      <button class="hotspot" data-id="0" aria-label="Auto"></button>
      <button class="hotspot" data-id="1" aria-label="Hut"></button>
      <button class="hotspot" data-id="2" aria-label="Lupe"></button>
      <button class="hotspot" data-id="3" aria-label="Schlüssel"></button>
      <button class="hotspot" data-id="4" aria-label="Kompass"></button>
    </div>
    <div id="toast"></div>
    <div id="spark-layer" aria-hidden="true"></div>
  </section>

  <section class="panel">
    <div class="row"><strong>Finde diese Gegenstände</strong><b id="score">0/5</b></div>
    <div id="targets"></div>
    <div class="controls">
      <button id="hint">💡<small>Hinweis</small></button>
      <button id="reset">↻<small>Neu</small></button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
